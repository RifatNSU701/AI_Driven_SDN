name: Build Multi-Platform Production Release Suite

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-ml-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - name: Generate 5,000-Flow Dataset, Train 6 Models & Run 8-Subsystem Verification
        run: |
          python scripts/generate_production_dataset.py
          python -m src.auth
          python src/train_models.py
          python src/robustness_suite.py
          python tests/test_production_suite.py

  build-desktop-packages:
    needs: verify-ml-and-backend
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies & Train Models
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/generate_production_dataset.py
          python src/train_models.py
      - name: Build Native Executable (.exe / .bin / .dmg)
        run: python scripts/build_desktop.py
      - name: Upload Native Desktop Package
        uses: actions/upload-artifact@v4
        with:
          name: AI_SDN_CyberSOC_Desktop_${{ matrix.os }}
          path: dist/*

  build-android-apk:
    needs: verify-ml-and-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Build Release APK
        working-directory: mobile_app
        run: |
          flutter create --project-name sdn_threat_mobile .
          flutter pub get
          flutter build apk --release
      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_SDN_CyberSOC_Android_APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk